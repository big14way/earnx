<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;background:#0a160f;overflow:hidden}
.base{position:absolute;inset:0;background:radial-gradient(90% 90% at 72% 8%,#1d4a33 0%,#10231a 50%,#0a160f 100%)}
.glow{position:absolute;border-radius:50%;filter:blur(120px)}
.g1{width:1000px;height:1000px;left:-260px;top:-420px;background:rgba(47,143,95,.40)}
.g2{width:820px;height:820px;right:-200px;top:120px;background:rgba(200,241,105,.16)}
.g3{width:760px;height:760px;left:640px;bottom:-460px;background:rgba(232,168,56,.20)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(246,241,231,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(246,241,231,.05) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 70% 62% at 50% 45%,#000 25%,transparent 80%)}
svg{position:absolute;inset:0}
</style></head><body>
<div class="base"></div><div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div><div class="grid"></div>
<svg width="1920" height="1080" viewBox="0 0 1920 1080">
 <path d="M300 820 C 700 520, 1100 560, 1620 300" stroke="#c8f169" stroke-opacity=".55" stroke-width="2.5" fill="none" stroke-dasharray="10 12"/>
 <path d="M300 820 C 760 760, 1180 820, 1640 700" stroke="#e8a838" stroke-opacity=".45" stroke-width="2" fill="none" stroke-dasharray="8 12"/>
 <circle cx="300" cy="820" r="11" fill="#c8f169"/><circle cx="300" cy="820" r="26" fill="#c8f169" fill-opacity=".18"/>
 <circle cx="1620" cy="300" r="8" fill="#e8a838"/><circle cx="1640" cy="700" r="8" fill="#e8a838"/>
</svg>
</body></html>
